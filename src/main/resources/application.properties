spring.application.name=MES
server.port=8090

# 全局时区统一为上海
spring.jackson.time-zone=Asia/Shanghai
spring.mvc.format.date-time=yyyy-MM-dd HH:mm:ss
spring.mvc.format.date=yyyy-MM-dd
spring.mvc.format.time=HH:mm:ss

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://ssdw8127.mysql.rds.aliyuncs.com/erp?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=UTF-8&zeroDateTimeBehavior=convertToNull&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=david
spring.datasource.password=dadazhengzheng@feng
spring.datasource.hikari.connection-init-sql=SET time_zone = '+08:00'

spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.validation-timeout=250
#logging.level.org.springframework.security=DEBUG
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl

spring.redis.host=localhost
spring.redis.port=6379
spring.redis.password=
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# application.properties
mybatis-plus.global-config.db-config.logic-delete-value=1
mybatis-plus.global-config.db-config.logic-not-delete-value=0
mybatis-plus.global-config.banner=false

# MyBatis Plus 配置
mybatis-plus.mapper-locations=classpath:mapper/**/*.xml

# Swagger(Springfox) 在 Spring Boot 2.6+ 的兼容配置
spring.mvc.pathmatch.matching-strategy=ant_path_matcher
# 开启 DevTools 自动重启，配合 IDE 热启动开发
spring.devtools.restart.enabled=true

# 急单抢占保护配置
# 临近开工保护窗口（分钟）：在该窗口内即将开工的订单不允许被抢占
mes.schedule.urgent-preempt.start-protect-window-minutes=240
# 单个订单+料号抢占时最小保底面积（㎡）
mes.schedule.urgent-preempt.min-protect-area=300
# 单个订单+料号抢占时最小保底比例（0~1）
mes.schedule.urgent-preempt.min-protect-ratio=0.20

# 齐套门禁策略：false=仅READY可放行；true=READY与READY_BY_ETA均可放行
mes.readiness.allow-ready-by-eta=false

# ==================== 物流查询（快递100）配置 ====================
# 开关：true 启用真实物流查询；false 使用未启用提示
mes.logistics.enabled=true
# 快递100查询接口（默认）
mes.logistics.api-url=https://poll.kuaidi100.com/poll/query.do
# 以下先放占位符，正式环境请替换为真实参数（建议用环境变量注入）
mes.logistics.customer=0DE5A3A18B8C1DEB299322B893C7D2BE
mes.logistics.key=uMdkLVWU6865
# 调用超时（毫秒）
mes.logistics.connect-timeout-ms=5000
mes.logistics.read-timeout-ms=8000

# ==================== 本机打印网关启动配置 ====================
# 启动 MES 后自动检查/重启本机标签打印网关
mes.print.gateway.enabled=false
# 后端启动时是否强制重启一次网关；true=先停掉同脚本进程再启动
mes.print.gateway.force-restart-on-start=false
# ERP 里的本机网关启动脚本路径
mes.print.gateway.script-path=E:/vue/ERP/tools/bartender/start-gateway.ps1
# 网关健康检查地址
mes.print.gateway.health-url=http://127.0.0.1:9123/health
# 启动后最多等待网关就绪的秒数
mes.print.gateway.startup-timeout-seconds=20
# MES 关闭时是否自动停止本机打印网关
mes.print.gateway.stop-on-shutdown=true



